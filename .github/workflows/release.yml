name: Release Helm Chart to GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-helm-chart:
    name: Package and Push Helm Chart to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercased repo owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ steps.owner.outputs.owner }}" --password-stdin

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          echo "Packaging chart at repository root..."
          helm package . --destination dist/

      - name: Push Helm Chart to GHCR
        run: |
          for pkg in dist/*.tgz; do
            echo "Pushing $pkg to oci://ghcr.io/${{ steps.owner.outputs.owner }}..."
            helm push "$pkg" "oci://ghcr.io/${{ steps.owner.outputs.owner }}"
          done
